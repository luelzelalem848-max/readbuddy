<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadBuddy — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login-screen.css" />
</head>
<body data-logo="📚">
<script>
  /* already signed in? go straight to the app */
  try {
    if (localStorage.getItem('readbuddy_name')) location.replace('app.html');
  } catch (e) {}
</script>

<div class="lg-stage">
  <canvas id="scene3d"></canvas>
  <div class="lg-vignette"></div>
</div>

<div class="lg-grid">
  <div class="lg-brand rv-in">
    <div class="lg-brand-logo">📚</div>
    <h1 class="lg-brand-name">ReadBuddy</h1>
    <p class="lg-brand-tag">A magical reading buddy who listens and cheers.</p>
    <div class="lg-brand-points">
      <span>✦ Voice-powered lessons</span>
      <span>✦ Stars, streaks & smiles</span>
      <span>✦ Works without internet</span>
    </div>
    <a class="lg-back" href="index.html">← Back to site</a>
  </div>

  <div class="lg-center">
    <form class="lg-card" id="lgCard" autocomplete="off">
      <div class="lg-halo"></div>
      <div class="lg-logo">📚</div>
      <h2 class="lg-title">Hello, young reader!</h2>
      <p class="lg-sub">What's your name, superstar?</p>
      <input class="lg-input" id="lgName" type="text" placeholder="Your name..." maxlength="40" autocomplete="off" />
      <p class="lg-error" id="lgError">We need your name to start the story ✨</p>
      <button class="lg-cta" type="submit" id="lgCta">Let's Read! ✨</button>
      <p class="lg-foot">🔒 Grown-ups: kid data stays on this device only.</p>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="scene3d.js"></script>
<script src="fx-pack.js"></script>
<script>
(function () {
  var input = document.getElementById('lgName'),
      card = document.getElementById('lgCard'),
      err = document.getElementById('lgError'),
      cta = document.getElementById('lgCta');
  setTimeout(function () { input.focus(); }, 700);

  function go() {
    var name = (input.value || '').trim();
    if (!name) {
      err.classList.add('lg-show');
      card.classList.remove('lg-shake');
      void card.offsetWidth;
      card.classList.add('lg-shake');
      input.focus();
      return;
    }
    localStorage.setItem('readbuddy_name', name);
    cta.textContent = 'Opening the storybook...';
    card.classList.add('lg-closing');
    setTimeout(function () { location.href = 'app.html'; }, 460);
  }
  card.addEventListener('submit', function (e) { e.preventDefault(); go(); });
  input.addEventListener('input', function () { err.classList.remove('lg-show'); });
})();
</script>
</body>
</html>
