<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadBuddy — Your AI Reading Tutor</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- AI Avatar -->
    <div class="avatar-area">
      <div class="avatar" id="avatar">
        <div class="avatar-face" id="avatarFace">
          <div class="avatar-eyes">
            <div class="eye" id="leftEye"></div>
            <div class="eye" id="rightEye"></div>
          </div>
          <div class="avatar-mouth" id="avatarMouth"></div>
        </div>
      </div>
      <div class="avatar-status" id="avatarStatus">Starting up...</div>
    </div>

    <!-- Speech Bubble -->
    <div class="speech-bubble" id="speechBubble">
      <p id="speechText">Loading...</p>
    </div>

    <!-- Main Display -->
    <div class="main-display" id="mainDisplay">
      <!-- Big letter/word shows here -->
      <div class="big-display" id="bigDisplay"></div>
      <!-- Emoji image -->
      <div class="emoji-display" id="emojiDisplay"></div>
    </div>

    <!-- Listening Indicator -->
    <div class="listening-zone" id="listeningZone">
      <div class="mic-ripple">
        <div class="ripple-circle"></div>
        <div class="ripple-circle delay1"></div>
        <div class="ripple-circle delay2"></div>
        <div class="mic-icon">🎤</div>
      </div>
      <p class="listening-text" id="listeningText">I'm listening...</p>
    </div>

    <!-- Score Bar -->
    <div class="score-bar" id="scoreBar" style="display:none;">
      <div class="score-chip">⭐ <span id="starsCount">0</span></div>
      <div class="score-chip">✅ <span id="correctCount">0</span></div>
      <div class="score-chip">🔥 <span id="streakCount">0</span></div>
    </div>

    <!-- Progress Dots -->
    <div class="progress-dots" id="progressDots" style="display:none;"></div>

    <!-- Feedback -->
    <div class="feedback-zone" id="feedbackZone"></div>

    <!-- Controls -->
    <div class="controls" id="controls" style="display:none;">
      <button id="repeatBtn" class="btn-control">🔊 Repeat</button>
      <button id="skipBtn" class="btn-control">⏭️ Skip</button>
      <button id="homeBtn" class="btn-control">🏠 Home</button>
    </div>

    <!-- Level Info -->
    <div class="level-info" id="levelInfo" style="display:none;">
      <span id="levelLabel">Level 1: Letters</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
